name: Release

# Create/update a GitHub Release whose notes come from the matching
# CHANGELOG.md section. DISPATCH-ONLY fallback/backfill tool.
#
# The primary release path is manual, from the workstation:
#   gh release create vX.Y.Z --target <merge-commit-sha> --notes-file <notes>
# which creates the tag + Release in one shot. This workflow is NOT wired to
# `on: push: tags` on purpose — doing so made it re-fire on every gh-created
# tag and fail (it looked for a CHANGELOG section that the tagged merge commit
# did not yet carry). Run it by hand only when you need to (re)publish a
# Release for a tag without the workstation gh.
#
# ABOUT THE "Verified" BADGE: it comes from the TAGGED COMMIT being signed,
# NOT from this workflow or the API. GitHub signs merge commits made through
# the web UI, so tagging a web-merge commit yields a Verified tag (that is how
# v1.16.x+ got the badge). This workflow does not touch signing.
#
# One-time prerequisite: Settings -> Actions -> General -> Workflow
# permissions -> "Read and write permissions".

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version WITHOUT the v prefix (e.g. 1.17.2). Needs a matching "## [x]" section in CHANGELOG.md.'
        required: true
      sha:
        description: 'Commit SHA to tag (only used when the tag does not exist yet). Empty = current main HEAD.'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The dispatch inputs reach the shell only through `env:` (never expanded
      # inline in a script), and are validated before any use: a value
      # such as `1.0.0"; curl ...` would otherwise run in a job that holds a
      # contents: write token.
      - name: Resolve tag / version
        id: r
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.17.2 (digits and dots, no v prefix)"
            exit 1
          fi
          echo "tag=v${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ver=${INPUT_VERSION}"  >> "$GITHUB_OUTPUT"

      - name: Ensure the tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.r.outputs.tag }}
          REPO: ${{ github.repository }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SHA" ] && ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::sha must be 7 to 40 lowercase hex characters (or empty for the current HEAD)"
            exit 1
          fi
          if ! gh api "repos/$REPO/git/refs/tags/$TAG" >/dev/null 2>&1; then
            # The refs API takes a full SHA: resolve an abbreviated one here,
            # which also proves it names a commit of this repository.
            SHA="$(git rev-parse --verify "${INPUT_SHA:-HEAD}^{commit}")"
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
            echo "Created tag $TAG at $SHA"
          fi

      - name: Extract CHANGELOG notes
        env:
          VERSION: ${{ steps.r.outputs.ver }}
        run: |
          set -euo pipefail
          # Literal prefix match (the version is never read as a regex).
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "::error::No CHANGELOG.md section for [$VERSION]"
            exit 1
          fi
          echo "----- notes -----"; cat NOTES.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.r.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file NOTES.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file NOTES.md --verify-tag
          fi
