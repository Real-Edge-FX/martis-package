# Weekly update PRs for everything the repository pins:
#
# - github-actions: every workflow action is pinned to a full commit SHA with
#   its version in a trailing comment; Dependabot bumps the SHA and the comment
#   together, so a moved tag can never change what CI runs unreviewed.
# - npm: the lockfile behind the Vitest, lint and build tooling (the SPA
#   itself ships prebuilt in public/).
# - composer: the PHP dependencies and dev tooling.
#
# Security advisories open their own PRs regardless of this schedule.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        update-types: [minor, patch]
